<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>whodaleader — grid engine prototype (wireframe)</title>
<style>
  /* Deliberately neutral. Real styling comes from the design system. */
  :root {
    --bg: #161819; --panel: #1f2224; --line: #34393c;
    --text: #e8eaec; --muted: #8a9298; --accent: #c9d1d6;
    --gap: 14px; --pad: 18px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
    background: var(--bg); color: var(--text);
    height: 100vh; overflow: hidden; display: flex; flex-direction: column;
    font-variant-numeric: tabular-nums;
  }

  /* ---------- control bar (prototype-only chrome) ---------- */
  .bar {
    display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
    padding: 12px var(--pad); border-bottom: 1px solid var(--line);
    font-size: 13px; color: var(--muted);
  }
  .bar b { color: var(--text); font-weight: 600; letter-spacing: .02em; }
  .seg { display: flex; gap: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 3px; }
  .seg button {
    background: none; border: 0; color: var(--muted); font: inherit;
    padding: 5px 10px; border-radius: 6px; cursor: pointer;
  }
  .seg button.active { background: var(--line); color: var(--text); }
  .note { margin-left: auto; font-size: 12px; }

  /* ---------- THE GRID ENGINE ----------
     2 columns x 2 rows. Widgets span via grid-row / grid-column.
     quarter = 1x1 cell, half = 1 column 2 rows, full = 2x2.   */
  .grid {
    flex: 1; min-height: 0;
    display: grid; gap: var(--gap); padding: var(--pad);
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
  }
  .slot {
    background: var(--panel); border: 1px dashed var(--line); border-radius: 10px;
    padding: 14px; display: flex; flex-direction: column; min-height: 0; overflow: hidden;
    position: relative;
  }
  .slot.full    { grid-column: 1 / 3; grid-row: 1 / 3; }
  .slot.half    { grid-row: span 2; }
  .slot.quarter { }

  .slot-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
  .slot-title { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .slot-head select {
    background: var(--bg); color: var(--text); border: 1px solid var(--line);
    border-radius: 6px; font: inherit; font-size: 12px; padding: 3px 6px; cursor: pointer;
  }
  .size-tag { position: absolute; bottom: 8px; right: 10px; font-size: 10px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; opacity: .6; }

  .body { flex: 1; min-height: 0; display: flex; flex-direction: column; }

  /* ---------- widget wireframes ---------- */
  .lb-row { display: grid; grid-template-columns: 1.5em 1fr auto; gap: 10px; align-items: center;
            padding: 6px 4px; border-bottom: 1px solid var(--line); font-size: 14px; }
  .lb-row:last-child { border-bottom: 0; }
  .lb-row .rk { color: var(--muted); font-weight: 700; text-align: center; }
  .lb-row .vl { font-weight: 700; }
  .lb-row.first { background: rgba(255,255,255,.05); border-radius: 6px; }
  .slot.full .lb-row { font-size: 17px; padding: 9px 6px; }

  .spot { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 4px; }
  .spot .who { font-weight: 800; line-height: 1.05; }
  .spot .num { font-weight: 800; color: var(--accent); line-height: 1; }
  .slot.quarter .spot .who { font-size: clamp(18px, 2.4vw, 30px); }
  .slot.quarter .spot .num { font-size: clamp(26px, 3.4vw, 44px); }
  .slot.half    .spot .who { font-size: clamp(24px, 3.2vw, 44px); }
  .slot.half    .spot .num { font-size: clamp(36px, 5vw, 68px); }
  .slot.full    .spot .who { font-size: clamp(36px, 5.5vw, 84px); }
  .slot.full    .spot .num { font-size: clamp(54px, 8vw, 128px); }
  .spot .sub { font-size: 12px; color: var(--muted); letter-spacing: .1em; text-transform: uppercase; }

  .tgt { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 10px; }
  .tgt .pct { font-weight: 800; font-size: clamp(24px, 3vw, 44px); }
  .slot.full .tgt .pct, .slot.half .tgt .pct { font-size: clamp(36px, 5vw, 72px); }
  .tgt .track { height: 14px; background: var(--bg); border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
  .tgt .fill { height: 100%; width: 68%; background: var(--accent); border-radius: 999px; }
  .tgt .meta { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; }

  .tick { flex: 1; overflow: hidden; display: flex; flex-direction: column; gap: 0; }
  .tick .ev { padding: 7px 2px; border-bottom: 1px solid var(--line); font-size: 13px; display: flex; gap: 8px; align-items: baseline; }
  .tick .ev:last-child { border-bottom: 0; }
  .tick .t { color: var(--muted); font-size: 11px; margin-left: auto; white-space: nowrap; }
  .slot.full .tick .ev { font-size: 16px; padding: 10px 4px; }

  .trend { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 10px; }
  .tr-row { display: grid; grid-template-columns: 70px 1fr auto; gap: 10px; align-items: center; font-size: 13px; }
  .tr-bars { display: flex; flex-direction: column; gap: 3px; }
  .tr-bar { height: 8px; border-radius: 4px; background: var(--line); }
  .tr-bar.now { background: var(--accent); }
  .tr-delta { font-weight: 700; font-size: 12px; }
  .tr-delta.up { color: #9fd6ae; } .tr-delta.down { color: #d6a09f; }
  .tr-legend { font-size: 11px; color: var(--muted); display: flex; gap: 14px; }
  .tr-legend i { display: inline-block; width: 14px; height: 8px; border-radius: 4px; margin-right: 4px; vertical-align: middle; }
</style>
</head>
<body>
  <div class="bar">
    <b>GRID ENGINE</b>
    <span>Tiling:</span>
    <div class="seg" id="tilings"></div>
    <span class="note">Wireframe only — styling comes from the design system. Change any slot's widget with its dropdown.</span>
  </div>
  <div class="grid" id="grid"></div>

<script>
(function () {
  /* ---- the same config model as config/screen.default.ts ---- */
  const TILINGS = {
    'Full':            [{ size:'full',    type:'leaderboard' }],
    'Two halves':      [{ size:'half',    type:'leaderboard' }, { size:'half', type:'trend' }],
    'Half + 2 qtrs':   [{ size:'half',    type:'leaderboard' }, { size:'quarter', type:'spotlight' }, { size:'quarter', type:'ticker' }],
    '4 quarters':      [{ size:'quarter', type:'leaderboard' }, { size:'quarter', type:'spotlight' }, { size:'quarter', type:'target' }, { size:'quarter', type:'ticker' }],
  };
  const TYPES = ['leaderboard','spotlight','target','ticker','trend'];
  let active = 'Half + 2 qtrs';
  let screen = JSON.parse(JSON.stringify(TILINGS[active]));

  /* ---- fake data ---- */
  const reps = ['Sarah Chen','Tom Okafor','Maya Patel','Leo Marsh','Nina Berg','Raj Singh','Ada Wolde','Kim Soo','Eli Brandt','Zoe Hart'];
  const vals = [248500,198200,176000,142800,119500,88300,71200,64900,52000,41000];
  const events = [
    ['Sarah closed Acme Ltd — £14,300','12m'], ['Tom logged 6 calls','28m'],
    ['Maya closed Brightline — £8,900','1h'], ['Leo booked 2 meetings','1h'],
    ['Nina closed Corvex — £21,000','2h'], ['Raj logged 11 emails','2h'],
    ['Ada closed Helix Co — £5,400','3h'], ['Kim booked a demo','3h'],
  ];

  /* ---- density rules: how widgets adapt to slot size (task 7 spec) ---- */
  const DENSITY = {
    leaderboard: { quarter: 3, half: 6, full: 10 },
    ticker:      { quarter: 3, half: 6, full: 8 },
    trend:       { quarter: 3, half: 5, full: 8 },
  };

  const money = n => '£' + n.toLocaleString('en-GB');

  function widgetHTML(w) {
    const n = (DENSITY[w.type] || {})[w.size] || 5;
    if (w.type === 'leaderboard') {
      return rows(n).map((i) =>
        '<div class="lb-row' + (i===0?' first':'') + '"><span class="rk">' + (i+1) + '</span><span>' + reps[i] + '</span><span class="vl">' + money(vals[i]) + '</span></div>'
      ).join('');
    }
    if (w.type === 'spotlight') {
      return '<div class="spot"><div class="sub">Top — activities</div><div class="who">Tom Okafor</div><div class="num">142</div></div>';
    }
    if (w.type === 'target') {
      return '<div class="tgt"><div class="pct">68%</div><div class="track"><div class="fill"></div></div><div class="meta"><span>£340k / £500k</span><span>14 days left</span></div></div>';
    }
    if (w.type === 'ticker') {
      return '<div class="tick">' + events.slice(0, n).map(e =>
        '<div class="ev"><span>' + e[0] + '</span><span class="t">' + e[1] + ' ago</span></div>').join('') + '</div>';
    }
    if (w.type === 'trend') {
      const deltas = ['+18%','-6%','+4%','+11%','-2%','+9%','+3%','-1%'];
      return '<div class="trend">' + rows(n).map(i =>
        '<div class="tr-row"><span>' + reps[i].split(' ')[0] + '</span>' +
        '<span class="tr-bars"><span class="tr-bar now" style="width:' + (90 - i*9) + '%"></span><span class="tr-bar" style="width:' + (80 - i*7) + '%"></span></span>' +
        '<span class="tr-delta ' + (deltas[i][0]==='+'?'up':'down') + '">' + deltas[i] + '</span></div>'
      ).join('') + '<div class="tr-legend"><span><i style="background:var(--accent)"></i>this period</span><span><i style="background:var(--line)"></i>same point last period</span></div></div>';
    }
    return '';
  }
  const rows = n => Array.from({length:n}, (_,i)=>i);

  function titleFor(t) {
    return { leaderboard:'Leaderboard — revenue', spotlight:'Spotlight', target:'Target — revenue', ticker:'Pulse', trend:'Trend — revenue' }[t];
  }

  function render() {
    const grid = document.getElementById('grid');
    grid.innerHTML = '';
    screen.forEach((w, idx) => {
      const slot = document.createElement('div');
      slot.className = 'slot ' + w.size;
      const sel = '<select data-idx="' + idx + '">' + TYPES.map(t =>
        '<option value="' + t + '"' + (t===w.type?' selected':'') + '>' + t + '</option>').join('') + '</select>';
      slot.innerHTML =
        '<div class="slot-head"><span class="slot-title">' + titleFor(w.type) + '</span>' + sel + '</div>' +
        '<div class="body">' + widgetHTML(w) + '</div>' +
        '<span class="size-tag">' + w.size + '</span>';
      grid.appendChild(slot);
    });
    grid.querySelectorAll('select').forEach(s => {
      s.onchange = e => { screen[Number(e.target.dataset.idx)].type = e.target.value; render(); };
    });
  }

  function buildTilingBar() {
    const bar = document.getElementById('tilings');
    Object.keys(TILINGS).forEach(name => {
      const b = document.createElement('button');
      b.textContent = name;
      b.className = name === active ? 'active' : '';
      b.onclick = () => {
        active = name;
        screen = JSON.parse(JSON.stringify(TILINGS[name]));
        bar.querySelectorAll('button').forEach(x => x.classList.toggle('active', x.textContent === name));
        render();
      };
      bar.appendChild(b);
    });
  }

  buildTilingBar();
  render();
})();
</script>
</body>
</html>
