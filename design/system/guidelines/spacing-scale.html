<!-- @dsCard group="Spacing" viewport="700x180" name="Spacing scale" subtitle="4px base grid, roomy for across-the-room reads" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; background:var(--surface-app); font-family:var(--font-body);
         padding:24px 30px; display:flex; align-items:flex-end; gap:14px; }
  .item { display:flex; flex-direction:column; gap:8px; align-items:flex-start; }
  .bar { background:var(--brand); border-radius:var(--radius-xs); height:auto; }
  .tok { font-family:var(--font-numeric); font-size:11px; font-weight:600; color:var(--text-muted); }
</style>
</head>
<body>
  <div class="item"><div class="bar" style="width:8px;height:8px"></div><span class="tok">2 · 8</span></div>
  <div class="item"><div class="bar" style="width:12px;height:12px"></div><span class="tok">3 · 12</span></div>
  <div class="item"><div class="bar" style="width:16px;height:16px"></div><span class="tok">4 · 16</span></div>
  <div class="item"><div class="bar" style="width:24px;height:24px"></div><span class="tok">6 · 24</span></div>
  <div class="item"><div class="bar" style="width:40px;height:40px"></div><span class="tok">8 · 40</span></div>
  <div class="item"><div class="bar" style="width:64px;height:64px"></div><span class="tok">10 · 64</span></div>
  <div class="item"><div class="bar" style="width:96px;height:96px"></div><span class="tok">12 · 96</span></div>
</body>
</html>
