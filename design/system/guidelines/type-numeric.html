<!-- @dsCard group="Type" viewport="700x190" name="Numeric — Space Grotesk" subtitle="Tabular figures for scores, ranks & deltas" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; background:var(--surface-app); color:var(--text-body); font-family:var(--font-body);
         padding:24px 30px; display:flex; align-items:center; gap:34px; }
  .big { font-family:var(--font-numeric); font-variant-numeric:tabular-nums lining-nums; font-weight:700;
         font-size:72px; line-height:1; color:var(--text-strong); letter-spacing:-0.02em; }
  .col { display:flex; flex-direction:column; gap:8px; }
  .row { display:flex; align-items:baseline; gap:10px; }
  .row .n { font-family:var(--font-numeric); font-variant-numeric:tabular-nums; font-weight:600; font-size:22px; color:var(--text-body); }
  .up { color:var(--up); font-weight:700; } .down { color:var(--down); font-weight:700; }
  .lab { color:var(--text-muted); font-size:12px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; }
</style>
</head>
<body>
  <div class="big">£128,400</div>
  <div class="col">
    <span class="lab">Tabular · no jitter</span>
    <div class="row"><span class="n">0123456789</span></div>
    <div class="row"><span class="n">$4,201</span><span class="up">▲ 12.4%</span></div>
    <div class="row"><span class="n">$3,560</span><span class="down">▼ 6.1%</span></div>
  </div>
</body>
</html>
