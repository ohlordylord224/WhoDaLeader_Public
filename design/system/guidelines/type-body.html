<!-- @dsCard group="Type" viewport="700x210" name="Body — Hanken Grotesk" subtitle="UI text & reading copy, 400–700 weight" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; background:var(--surface-app); color:var(--text-body); font-family:var(--font-body);
         padding:24px 30px; display:flex; flex-direction:column; gap:12px; }
  .lead { font-size:19px; font-weight:600; color:var(--text-strong); max-width:600px; line-height:1.4; }
  .copy { font-size:15px; font-weight:400; color:var(--text-muted); max-width:600px; line-height:1.6; }
  .weights { display:flex; gap:18px; align-items:baseline; }
  .weights span { font-size:18px; color:var(--text-body); }
  .w4{font-weight:400;} .w5{font-weight:500;} .w6{font-weight:600;} .w7{font-weight:700;} .w8{font-weight:800;}
</style>
</head>
<body>
  <div class="lead">See who's pulling ahead — and who needs a nudge.</div>
  <div class="copy">Hanken Grotesk carries every label, table cell, and paragraph. Friendly, even color, and tall x-height keep it sharp on a wall-mounted screen.</div>
  <div class="weights"><span class="w4">Regular</span><span class="w5">Medium</span><span class="w6">Semibold</span><span class="w7">Bold</span><span class="w8">Black</span></div>
</body>
</html>
