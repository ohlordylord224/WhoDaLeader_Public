<!-- @dsCard group="Type" viewport="700x320" name="Type scale" subtitle="Hero → eyebrow, editorial contrast in one ramp" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; background:var(--surface-app); color:var(--text-body); font-family:var(--font-body);
         padding:22px 30px; display:flex; flex-direction:column; gap:6px; }
  .r { display:flex; align-items:baseline; gap:16px; }
  .r .tag { font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--text-faint);
            width:120px; flex:none; }
  .d { font-family:var(--font-display); font-weight:800; color:var(--text-strong); line-height:1.05; letter-spacing:-0.02em; }
  .b { font-family:var(--font-body); color:var(--text-body); }
  .s140{font-size:54px;} .s108{font-size:44px;} .s66{font-size:36px;} .s40{font-size:28px;} .s26{font-size:20px;} .s16{font-size:15px; font-weight:500;} .s12{font-size:12px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--text-muted);}
</style>
</head>
<body>
  <div class="r"><span class="tag">Hero / 108</span><span class="d s108">1st</span></div>
  <div class="r"><span class="tag">Display / 66</span><span class="d s66">Leaderboard</span></div>
  <div class="r"><span class="tag">Title / 40</span><span class="d s40">This week's movers</span></div>
  <div class="r"><span class="tag">Heading / 26</span><span class="d s26">Team Velocity</span></div>
  <div class="r"><span class="tag">Body / 16</span><span class="b s16">Closed deals across the North region.</span></div>
  <div class="r"><span class="tag">Eyebrow / 12</span><span class="b s12">Live now</span></div>
</body>
</html>
