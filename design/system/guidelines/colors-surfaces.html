<!-- @dsCard group="Colors" viewport="700x180" name="Surfaces — Slate ramp" subtitle="Neutral grey, app → sunken" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; background:var(--surface-app); font-family:var(--font-body);
         padding:24px 30px; display:flex; flex-direction:column; gap:12px; }
  .cap { font-family:var(--font-body); font-weight:700; font-size:13px; color:var(--text-muted); }
  .row { display:flex; gap:0; border-radius:var(--radius-md); overflow:hidden; border:1px solid var(--border-default); }
  .sw { flex:1; height:88px; display:flex; align-items:flex-end; padding:8px 10px;
        font-family:var(--font-numeric); font-size:10px; font-weight:600; color:var(--text-muted); }
  .a{background:var(--slate-980);} .b{background:var(--slate-950);} .c{background:var(--slate-900);} .d{background:var(--slate-850);} .e{background:var(--slate-800);} .f{background:var(--slate-700);} .g{background:var(--slate-600); color:var(--text-body);}
</style>
</head>
<body>
  <div class="cap">SLATE — surface ramp</div>
  <div class="row">
    <div class="sw a">980</div><div class="sw b">950·app</div><div class="sw c">900</div><div class="sw d">850·card</div><div class="sw e">800</div><div class="sw f">700</div><div class="sw g">600</div>
  </div>
</body>
</html>
