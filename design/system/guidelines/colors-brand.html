<!-- @dsCard group="Colors" viewport="700x190" name="Brand — Azure primary" subtitle="Soft → base → bright, the Whosdaleader blue" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; background:var(--surface-app); font-family:var(--font-body);
         padding:24px 30px; display:flex; flex-direction:column; gap:14px; }
  .row { display:flex; gap:12px; }
  .sw { flex:1; height:84px; border-radius:var(--radius-md); display:flex; flex-direction:column; justify-content:flex-end;
        padding:10px 12px; font-family:var(--font-numeric); font-size:11px; font-weight:600; }
  .s1{ background:var(--azure-soft); color:var(--brand-bright);}
  .s2{ background:var(--azure-300); color:#08213d;}
  .s3{ background:var(--azure-500); color:#fff;}
  .s4{ background:var(--azure-600); color:#fff;}
  .s5{ background:var(--azure-bright); color:#08213d;}
  .cap { font-family:var(--font-body); font-weight:700; font-size:13px; color:var(--text-muted); }
</style>
</head>
<body>
  <div class="cap">AZURE — brand primary</div>
  <div class="row">
    <div class="sw s1">soft</div>
    <div class="sw s2">300</div>
    <div class="sw s3">500 · brand</div>
    <div class="sw s4">600 · hover</div>
    <div class="sw s5">bright</div>
  </div>
</body>
</html>
