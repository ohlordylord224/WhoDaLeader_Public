<!-- @dsCard group="Spacing" viewport="700x180" name="Corner radii" subtitle="Rounded & candy — sm 10 → pill" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; background:var(--surface-app); font-family:var(--font-body);
         padding:24px 30px; display:flex; align-items:center; gap:18px; }
  .item { display:flex; flex-direction:column; gap:8px; align-items:center; }
  .box { width:80px; height:80px; background:var(--azure-soft); border:2px solid var(--brand); }
  .tok { font-family:var(--font-numeric); font-size:11px; font-weight:600; color:var(--text-muted); }
</style>
</head>
<body>
  <div class="item"><div class="box" style="border-radius:var(--radius-sm)"></div><span class="tok">sm · 10</span></div>
  <div class="item"><div class="box" style="border-radius:var(--radius-md)"></div><span class="tok">md · 14</span></div>
  <div class="item"><div class="box" style="border-radius:var(--radius-lg)"></div><span class="tok">lg · 20</span></div>
  <div class="item"><div class="box" style="border-radius:var(--radius-xl)"></div><span class="tok">xl · 26</span></div>
  <div class="item"><div class="box" style="border-radius:var(--radius-2xl)"></div><span class="tok">2xl · 34</span></div>
  <div class="item"><div class="box" style="border-radius:var(--radius-pill)"></div><span class="tok">pill</span></div>
</body>
</html>
