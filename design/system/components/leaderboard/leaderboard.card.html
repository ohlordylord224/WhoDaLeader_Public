<!-- @dsCard group="Components" viewport="700x680" name="Leaderboard — rows, ranks, deltas" subtitle="RankBadge, StatDelta, ProgressBar, MetricTile, LeaderRow" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body{ margin:0; background:var(--surface-app); color:var(--text-body); font-family:var(--font-body); padding:26px 30px; }
  h4{ font-size:12px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--text-faint); margin:0 0 12px; }
  .group{ margin-bottom:26px; }
  .row{ display:flex; flex-wrap:wrap; gap:14px; align-items:center; }
  .stack{ display:flex; flex-direction:column; gap:10px; }
  .tiles{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
  [data-lucide]{ width:20px; height:20px; }
</style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/lucide@0.456.0/dist/umd/lucide.min.js"></script>
  <script src="../../_ds_bundle.js"></script>
  <script type="text/babel">
    const { RankBadge, StatDelta, ProgressBar, MetricTile, LeaderRow } = window.WhosdaleaderDesignSystem_012310;
    const I = ({ n }) => <i data-lucide={n}></i>;

    function Demo(){
      return (
        <div>
          <div className="group">
            <h4>Rank badges &amp; deltas</h4>
            <div className="row">
              <RankBadge rank={1} size="lg"/>
              <RankBadge rank={2} size="lg"/>
              <RankBadge rank={3} size="lg"/>
              <RankBadge rank={8} size="lg"/>
              <StatDelta value={12.4} suffix="%"/>
              <StatDelta value={-6.1} suffix="%"/>
              <StatDelta value={12.4} suffix="%" variant="pill"/>
              <StatDelta value={-6.1} suffix="%" variant="pill"/>
              <StatDelta direction="flat" showArrow={true}>Holding</StatDelta>
            </div>
          </div>

          <div className="group">
            <h4>Progress</h4>
            <div className="stack">
              <ProgressBar value={84} tone="up" label="Priya — quota" showValue={true}/>
              <ProgressBar value={128400} max={150000} tone="gold" label="Team Q3 target" valueLabel="£128.4k / £150k"/>
              <ProgressBar value={42} tone="brand" label="Calls to goal" showValue={true}/>
            </div>
          </div>

          <div className="group">
            <h4>Metric tiles</h4>
            <div className="tiles">
              <MetricTile label="Revenue won" value="£128.4k" delta={12.4} caption="vs last wk" icon={<I n="trophy"/>} iconTone="gold"/>
              <MetricTile label="Deals closed" value="63" delta={8.0} caption="vs last wk" icon={<I n="circle-check-big"/>} iconTone="up"/>
              <MetricTile label="Calls made" value="1,204" delta={-3.2} caption="vs last wk" icon={<I n="phone"/>} iconTone="sky"/>
            </div>
          </div>

          <div className="group">
            <h4>Leader rows</h4>
            <div className="stack">
              <LeaderRow rank={1} name="Priya Anand" team="North · Enterprise" value="£42.1k" delta={18.2} movement={2} progress={{value:84}} lead={true}/>
              <LeaderRow rank={2} name="Marcus Bell" team="North · SMB" value="£38.9k" delta={4.1} movement={-1} progress={{value:77}}/>
              <LeaderRow rank={3} name="Tom Okafor" team="South · Mid-market" value="£31.4k" delta={-2.6} movement={0} progress={{value:62}}/>
            </div>
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
    setTimeout(()=>window.lucide && window.lucide.createIcons(), 60);
  </script>
</body>
</html>
